name: Publish TraceLeak Package

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@miqdaadisds'

      - name: Publish to GitHub Packages
        run: |
          cd frontend/packages/traceleak
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view @miqdaadisds/traceleak@${PKG_VERSION} > /dev/null 2>&1; then
            echo "Version ${PKG_VERSION} is already published to GitHub Packages. Skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
